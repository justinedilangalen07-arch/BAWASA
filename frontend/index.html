<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BAWASA Management System | Admin Login</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-card">

        <!-- Header -->
        <div class="card-header">

            <div class="logo-wrapper">

                <svg xmlns="http://www.w3.org/2000/svg"
                     class="logo-icon"
                     viewBox="0 0 24 24"
                     fill="currentColor">

                    <path d="M12 2.69L17.66 8.35A8 8 0 1 1 6.34 8.35L12 2.69Z"/>

                </svg>

            </div>

            <h1 class="card-title">BAWASA</h1>

            <p class="card-subtitle">
                Barangay Water System Association
            </p>

        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="alert-error hidden">
            Invalid username or password.
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="login-form">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    autocomplete="username"
                    required>

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required>

            </div>

            <button type="submit" class="btn-primary login-btn">
                Login
            </button>

        </form>


        <!-- Footer -->
        <div class="card-footer">
            © 2026 BAWASA Management System
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
