<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAWASA - Water Consumers</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">

        <h2>BAWASA</h2>

        <ul>
            <li><a href="dashboard.html">🏠 Dashboard</a></li>
            <li><a href="residents.html">👥 Residents</a></li>
            <li><a href="consumers.html">💧 Water Consumers</a></li>
            <li><a href="billing.html">🧾 Billing</a></li>
            <li><a href="payments.html">💵 Payments</a></li>
            <li><a href="reports.html">📊 Reports</a></li>
            <li><a href="settings.html">⚙ Settings</a></li>
        </ul>

    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <div class="topbar">
            <h1>Water Consumers</h1>

            <button class="btn-primary" onclick="focusForm()">
                + Add Consumer
            </button>
        </div>

        <!-- Consumer Form -->
        <div class="card">

            <h2>Consumer Information</h2>

            <form id="consumerForm">

                <input
                    type="text"
                    id="consumerName"
                    placeholder="Consumer Name"
                    required>

                <input
                    type="text"
                    id="accountNo"
                    placeholder="Account Number"
                    required>

                <input
                    type="text"
                    id="meterNo"
                    placeholder="Meter Number"
                    required>

                <select id="status" required>
                    <option value="">Select Status</option>
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                </select>

                <button type="submit" class="btn-primary">
                    Save Consumer
                </button>

            </form>

        </div>

        <br>

        <!-- Consumers Table -->
        <div class="table-container">

            <h2>Consumer Records</h2>

            <table>

                <thead>
                    <tr>
                        <th>Account No.</th>
                        <th>Consumer Name</th>
                        <th>Meter No.</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="consumerTable">

                    <tr>
                        <td>1001</td>
                        <td>Juan Dela Cruz</td>
                        <td>MTR-001</td>
                        <td>Active</td>
                        <td>
                            <button onclick="editRow(this)">
                                Edit
                            </button>

                            <button onclick="deleteRow(this)">
                                Delete
                            </button>
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </main>

</div>

<script>

document.getElementById("consumerForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    let accountNo =
        document.getElementById("accountNo").value;

    let consumerName =
        document.getElementById("consumerName").value;

    let meterNo =
        document.getElementById("meterNo").value;

    let status =
        document.getElementById("status").value;

    let table =
        document.getElementById("consumerTable");

    let row = `
        <tr>
            <td>${accountNo}</td>
            <td>${consumerName}</td>
            <td>${meterNo}</td>
            <td>${status}</td>
            <td>
                <button onclick="editRow(this)">
                    Edit
                </button>

                <button onclick="deleteRow(this)">
                    Delete
                </button>
            </td>
        </tr>
    `;

    table.innerHTML += row;

    document.getElementById("consumerForm").reset();

});

function deleteRow(button){
    button.parentElement.parentElement.remove();
}

function editRow(button){

    let row =
        button.parentElement.parentElement;

    document.getElementById("accountNo").value =
        row.cells[0].innerText;

    document.getElementById("consumerName").value =
        row.cells[1].innerText;

    document.getElementById("meterNo").value =
        row.cells[2].innerText;

    document.getElementById("status").value =
        row.cells[3].innerText;

    row.remove();
}

function focusForm(){
    document.getElementById("consumerName").focus();
}

</script>

</body>
</html>
