<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barangay Management System - Admin Login</title>
  
  <!-- Link External CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="login-card">
    
    <!-- Header Section -->
    <div class="card-header">
      <div class="logo-wrapper">
        <!-- Water Drop Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" class="logo-icon" viewBox="0 0 24 24">
          <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z" />
        </svg>
      </div>
      <h2 class="card-title">ADMINISTRATOR PORTAL</h2>
      <p class="card-subtitle">Barangay Water System Association</p>
    </div>

    <!-- Alert Box for Error Messages -->
    <div id="errorMessage" class="alert-error hidden">
      Invalid username or password.
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="login-form">
      
      <!-- Username Input -->
      <div class="form-group">
        <label for="username" class="form-label">Admin Username</label>
        <input type="text" id="username" class="form-input" placeholder="Enter admin username" required>
      </div>

      <!-- Password Input -->
      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" required>
      </div>

      <!-- Demo Credentials Helper -->
      <div class="demo-helper">
        <p class="demo-title">Demo Admin Credentials:</p>
        <p>Username: <code class="code-badge">admin</code></p>
        <p>Password: <code class="code-badge">admin123</code></p>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-submit">
        Login to Dashboard
      </button>
    </form>

    <!-- Footer -->
    <div class="card-footer">
      Restricted Access &bull; Authorized Personnel Only
    </div>

  </div>

  <!-- Link External JS Script -->
  <script src="script.js"></script>

</body>
</html>
